<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="14" fill="#090A0F"/>
  <rect width="64" height="64" rx="14" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- PC Monitor Frame -->
  <rect x="10" y="10" width="44" height="32" rx="4" fill="#0f172a" stroke="#f8fafc" stroke-width="2.5"/>
  
  <!-- Stand & Base -->
  <path d="M28 42 L24 53 H40 L36 42" fill="#f8fafc"/>
  <rect x="20" y="52" width="24" height="3" rx="1.5" fill="#f8fafc"/>

  <!-- Screen Content: Glowing Neural Node / Synapse -->
  <circle cx="32" cy="26" r="3.5" fill="#10b981"/>
  
  <!-- Neural Radiating Nodes -->
  <circle cx="23" cy="18" r="1.8" fill="#34d399"/>
  <circle cx="41" cy="18" r="1.8" fill="#34d399"/>
  <circle cx="19" cy="28" r="1.8" fill="#34d399"/>
  <circle cx="45" cy="28" r="1.8" fill="#34d399"/>
  <circle cx="25" cy="34" r="1.8" fill="#34d399"/>
  <circle cx="39" cy="34" r="1.8" fill="#34d399"/>

  <!-- Synapse Connector Lines -->
  <path d="M32 26 L23 18" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 26 L41 18" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 26 L19 28" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 26 L45 28" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 26 L25 34" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 26 L39 34" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Terminal Command Prompt Dot -->
  <circle cx="32" cy="38" r="1" fill="#10b981"/>
</svg>
